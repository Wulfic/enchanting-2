// Phase 12F: the server GameTest report, shared by every version node (build.gradle) and matrix node (matrix.gradle).
// The `gameTest` run writes a JUnit-style report to <project>/build/gametest-report.xml, and checkGameTestReport turns
// "nothing ran" into a failure: the server exits non-zero on a failed test, but a run that loads no tests (a missing
// jar, a wrong entrypoint, a GameTest class left out of fabric.mod.json) also exits 0. verifyReport reads the file.
def gameTestReport = new File(layout.buildDirectory.get().asFile.canonicalFile, 'gametest-report.xml')

// Fabric's runner takes the file as a property; NeoForge's and Forge's GameTest servers are vanilla's GameTestMainUtil,
// whose --report writes the same JUnit-style XML (Phase 13C/13D). Exactly one of the run systems is on a node.
// The task that runs the server: on Forge, the one build.forge.gradle names (runGameTest is an alias there).
def gameTestRunTask = 'runGameTest'
if (project.extensions.findByName('loom') != null) {
    loom.runs.matching { it.name == 'gameTest' }.configureEach {
        property 'fabric-api.gametest.report-file', gameTestReport.absolutePath
    }
} else if (project.extensions.findByName('neoForge') != null) {
    neoForge.runs.matching { it.name == 'gameTest' }.configureEach {
        programArgument '--report'
        programArgument gameTestReport.absolutePath
    }
} else if (project.findProperty('mod_loader') == 'forge') {
    minecraft.runs.matching { it.name == 'gameTestServer' }.configureEach {
        args '--report', gameTestReport.absolutePath
    }
    gameTestRunTask = project.forge_game_test_run_task
} else {
    throw new GradleException("${project.path}: gametest-report.gradle needs Loom, ModDevGradle or ForgeGradle runs")
}

def checkGameTestReport = tasks.register('checkGameTestReport') {
    def report = gameTestReport
    def nodeName = project.path
    doLast {
        if (!report.isFile()) {
            def siblings = report.parentFile.list()?.findAll { it.startsWith('gametest') } ?: []
            throw new GradleException("No GameTest report at ${report}: the GameTest server didn't run, or its report " +
                "was removed afterwards (gametest* files there now: ${siblings ?: 'none'}; checked ${new Date()})")
        }
        def suite = new groovy.xml.XmlSlurper().parse(report)
        def cases = suite.'**'.findAll { it.name() == 'testcase' }
        def failed = cases.findAll { !it.failure.isEmpty() || !it.error.isEmpty() }
        logger.lifecycle("GameTests on ${nodeName}: ${cases.size()} ran, ${failed.size()} failed (${report})")
        if (cases.isEmpty()) {
            throw new GradleException("The GameTest report at ${report} has no test cases: the GameTest jar didn't load")
        }
        if (!failed.isEmpty()) {
            throw new GradleException("${failed.size()} GameTests failed on ${nodeName}: " +
                failed.collect { it.@name.text() }.join(', '))
        }
    }
}
// matching, not named: ForgeGradle registers its run tasks after this script has run.
// The root's slot limit on GameTest servers (stonecutter.gradle); a node configured without it fails here, not later.
def gameTestServers = gradle.sharedServices.registrations.getByName('gameTestServers').service
tasks.matching { it.name == gameTestRunTask }.configureEach {
    usesService gameTestServers
    // A report left by an earlier run must never pass for this one. Logged, so a report that vanishes after a passing
    // run (once under a loaded verifyAll, gotchas.md 2026-10-20) shows whether this delete is what removed it.
    def deletePath = project.path
    doFirst {
        if (gameTestReport.exists()) {
            logger.lifecycle("${deletePath}: deleting the previous GameTest report ${gameTestReport} " +
                "(${new Date(gameTestReport.lastModified())})")
            // Fail closed: a report that can't be deleted (Windows: another process holds it) would pass this run.
            if (!gameTestReport.delete()) {
                throw new GradleException("Could not delete the previous GameTest report ${gameTestReport}; another " +
                    "process may hold it (a second build on this tree? gotchas.md 2026-10-20). Refusing to run, so " +
                    "the old report can't pass for this run.")
            }
        }
    }
    finalizedBy checkGameTestReport
}
