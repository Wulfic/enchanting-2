# NeoForge's mod metadata (Phase 13C): the same mod, name and text as fabric.mod.json. Expanded by processResources
# (gradle/common.gradle) with the node's values. src/neoforge/resources is added to main only on NeoForge nodes.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Wulfic/enchanting-2/issues"

[[mods]]
modId = "enchanting2"
version = "${version}"
displayName = "Enchanting 2"
description = "Flat XP curve past level 30, unlimited applicable enchantments, transparent additive costs and a readable enchanting table."
authors = "Wulfic"
displayURL = "https://github.com/Wulfic/enchanting-2/wiki"
# Both keys: NeoForge 26.1.2 reads only logoFile; 26.2+ reads iconFile (square icon), and a dev client stops on a
# warning screen when logoFile has no iconFile/bannerFile beside it (LogoFileWarningsHandler, TODO.md 13G).
logoFile = "assets/enchanting2/icon.png"
iconFile = "assets/enchanting2/icon.png"

[[mixins]]
config = "enchanting2.mixins.json"

[[mixins]]
config = "enchanting2.client.mixins.json"

[[dependencies.enchanting2]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.enchanting2]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"
