# ---------------------------------------------------------------------------
# Release: pushing a tag v<mod_version> builds one jar per band and publishes a GitHub Release (Phase 12G).
#
#   1. Bump mod_version in gradle.properties and add a "## [<version>] - YYYY-MM-DD" section to CHANGELOG.md
#      (ReleaseDocsTest fails the build until both agree). Commit and push to main; let CI go green.
#   2. git tag v<version> && git push origin v<version>
#
# Every version node in versions/ is one band and one jar: enchanting2-<version>+<band>.jar, the band being the
# Minecraft versions it is proven on (build.gradle derives it from the node and the runtime matrix), e.g. +1.21.11 or
# +26.1-26.1.2. The build is ./gradlew verifyAll, the same check CI runs.
#
# This workflow REFUSES, before building anything, when:
#   - the tag isn't exactly v + mod_version (a v1.0.1 tag on a 1.0.0 tree would ship jars named 1.0.0),
#   - the tagged commit isn't on main (no releases from side branches),
#   - CHANGELOG.md has no section for the version (it becomes the release notes),
#   - a release for the tag already exists (re-running never overwrites a published jar);
# and, after the build, when a node hasn't produced exactly one mod jar and its sources jar, or a jar's own
# fabric.mod.json version isn't the <version>+<band> its file name says.
#
# Nothing here deletes anything. If the build fails, no release is created and the tag stays where it is: fix on
# main, then move the tag (git tag -f v<version> && git push origin v<version> --force) or bump the version.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for the on-main check)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag, version and changelog
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prop() { grep -E "^$2=" "$1" | head -n1 | cut -d= -f2- | tr -d '[:space:]'; }
          shopt -s nullglob
          nodes=(versions/*/gradle.properties)
          if [ ${#nodes[@]} -eq 0 ]; then
            echo "::error::No versions/<node>/gradle.properties found; settings.gradle declares the nodes."
            exit 1
          fi
          version=$(prop gradle.properties mod_version)
          gjv=$(prop gradle.properties gradle_java_version)
          if [ -z "$version" ] || [ -z "$gjv" ]; then
            echo "::error::Missing mod_version or gradle_java_version in gradle.properties."
            exit 1
          fi
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} doesn't match mod_version ${version} in gradle.properties; expected v${version}. Refusing to release."
            exit 1
          fi
          # The commit the tag names; for an annotated tag GITHUB_SHA isn't guaranteed to be it.
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${TAG} points at ${commit:0:7}, which is not on main. Release only from main."
            exit 1
          fi

          # Every JDK a version node or matrix node compiles or runs on, as in ci.yml; Gradle's own is listed last.
          levels=""
          for f in "${nodes[@]}" matrix/*/gradle.properties; do
            v=$(prop "$f" java_version)
            case "$v" in
              ''|*[!0-9]*) echo "::error::$f has java_version '$v', not a plain major version (e.g. 25)." >&2; exit 1 ;;
            esac
            levels="$levels $v"
          done
          mods=$(printf '%s\n' $levels | sort -un | grep -vx "$gjv" || true)

          # The CHANGELOG section for this version, heading excluded, up to the next "## [" heading, without the
          # "[1.0.0]: https://..." link definitions that end the file.
          awk -v v="$version" '
            index($0, "## [" v "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' section (or it is empty). Refusing to release."
            exit 1
          fi

          {
            echo "version=$version"
            echo "commit=$commit"
            echo "gradle_java_version=$gjv"
            echo "mod_jdks<<EOF"
            for v in $mods; do echo "$v"; done
            echo "EOF"
            echo "from_env=$(for v in $mods $gjv; do printf 'JAVA_HOME_%s_X64,' "$v"; done | sed 's/,$//')"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (${#nodes[@]} band(s)) from ${commit:0:7}."

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for ${TAG} already exists. This workflow never replaces a published jar; bump mod_version for a new release."
            exit 1
          fi

      # The nodes' JDKs for their toolchains, then the one Gradle runs on (the last one listed becomes JAVA_HOME).
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ steps.meta.outputs.mod_jdks }}
            ${{ steps.meta.outputs.gradle_java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test every node (verifyAll)
        run: >-
          ./gradlew verifyAll --no-daemon --stacktrace
          -Porg.gradle.java.installations.fromEnv=${{ steps.meta.outputs.from_env }}

      # One mod jar + its sources jar per node, each checked against its own metadata; the notes get a jar table.
      - name: Collect the jars
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: scripts/release-collect.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          mapfile -t files < release-files.txt
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Enchanting 2 ${VERSION}" \
            --notes-file release-notes.md
          {
            echo "### Released ${TAG}"
            echo "Enchanting 2 ${VERSION} from \`${COMMIT:0:7}\`: ${#files[@]} files."
          } >> "$GITHUB_STEP_SUMMARY"
