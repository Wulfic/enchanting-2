# ---------------------------------------------------------------------------
# CI: every push to main and every pull request.
#
#   build    ./gradlew verifyAll (Phase 12F, stonecutter.gradle): every version node's build (compile, JUnit, server
#            GameTests), every runtime-matrix node's static link check, and the server GameTests of each matrix version
#            a jar claims without being built for. The same task as scripts/verify-all.sh, so CI and a local run can't
#            drift. One job per loader (13F: -Ploaders=<loader>; the matrix nodes go with fabric). verifyReport writes
#            one line per node to the job summary. The jars (versions/<node>/build/libs/) are kept as a run artifact
#            (enchanting2-<loader>-<sha>) for 14 days, so any commit can be tried in game without building it.
#   boot     Phase 13F: scripts/boot-all.sh boots the built jars on real loader servers (scripts/boot-matrix.txt,
#            scripts/server_boot_check.py) and checks the scripts/checks/boot.txt fingerprint. On a push or pull
#            request, the "shipped" rows (each jar on its own loader and Minecraft); on workflow_dispatch, every row
#            (older NeoForge/Forge builds, Quilt boots and Quilt server GameTests). Owner 2026-10-21. One job per loader;
#            Quilt has no shipped rows, so its job only runs on dispatch. Server logs are kept for 14 days.
#   secrets  gitleaks over the WHOLE history, not just the pushed commits. The repo went public after a history
#            scrub (TODO 11e); a secret committed again would be public on push, so this job fails the run loudly.
#
#   client   ./gradlew :<node>:runClientGameTest on every Fabric version node, one job per node, under Xvfb with
#            Mesa's software renderer. The node list is versions/*/ minus the NeoForge and Forge nodes (*-neoforge,
#            *-forge: client GameTests are Fabric's API, TODO.md Phase 13), so a new Fabric node is covered without
#            editing this file. Screenshots and the game log are kept for 14 days, pass or fail.
# Releases are a separate workflow (release.yml), started by pushing a v* tag.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every node's JDK and Gradle's own, read from the properties files (.github/actions/setup-jdks).
      - name: Set up JDKs
        id: jdk
        uses: ./.github/actions/setup-jdks

      # Also validates the Gradle wrapper jar's checksum against Gradle's published list.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # fromEnv points the toolchains at the JDKs setup-java installed, instead of foojay downloading others.
      # --continue: every node runs even after one fails, so the report below shows all of them.
      - name: Build, test and check every node (verifyAll)
        run: >-
          ./gradlew verifyAll --continue --no-daemon --stacktrace -Ploaders=${{ matrix.loader }}
          -Porg.gradle.java.installations.fromEnv=${{ steps.jdk.outputs.from_env }}

      # Reads the result files only; runs after a failure too. The step's own status never decides the run.
      - name: Report per node
        if: always()
        run: |
          {
            echo '```'
            ./gradlew verifyReport -q --no-daemon -Ploaders=${{ matrix.loader }} \
              -Porg.gradle.java.installations.fromEnv=${{ steps.jdk.outputs.from_env }} || echo "verifyReport failed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: enchanting2-${{ matrix.loader }}-${{ github.sha }}
          path: versions/*/build/libs/*.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.loader }}-${{ github.sha }}
          path: |
            versions/*/build/reports/
            versions/*/build/test-results/
            versions/*/build/gametest-report.xml
            matrix/*/build/gametest-report.xml
            matrix/*/build/linkcheck/report.txt
          retention-days: 14
          if-no-files-found: ignore

  boot:
    name: Real-server boot (${{ matrix.loader }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge, quilt]
    env:
      # Quilt runs the Fabric jars.
      JAR_LOADER: ${{ matrix.loader == 'quilt' && 'fabric' || matrix.loader }}
      TIER: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'shipped' }}
    steps:
      - name: Checkout
        if: matrix.loader != 'quilt' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      # The servers run on the newest JDK the nodes ask for (setup-jdks puts it on PATH last).
      - name: Set up JDKs
        if: matrix.loader != 'quilt' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-jdks

      # Unpacks to versions/<node>/build/libs/, where boot-all.sh looks.
      - name: Download jars
        if: matrix.loader != 'quilt' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: enchanting2-${{ env.JAR_LOADER }}-${{ github.sha }}
          path: versions

      - name: Boot on real servers (${{ env.TIER }} rows)
        if: matrix.loader != 'quilt' || github.event_name == 'workflow_dispatch'
        env:
          PYTHON: python3
        run: bash scripts/boot-all.sh "$TIER" "${{ matrix.loader }}"

      - name: Upload server logs
        if: always() && (matrix.loader != 'quilt' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.loader }}-${{ github.sha }}
          path: |
            build/boot/*/*.out
            build/boot/*/*/server.log
            build/boot/*/*/build/run/gameTest/gametest-report.xml
          retention-days: 14
          if-no-files-found: ignore

  client-nodes:
    name: List version nodes
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.list.outputs.nodes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List versions/*/
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob
          props=(versions/*/gradle.properties)
          if [ ${#props[@]} -eq 0 ]; then
            echo "::error::No versions/<node>/gradle.properties found; settings.gradle declares the nodes."
            exit 1
          fi
          # Fabric nodes only: client GameTests run on Fabric's client GameTest API (Phase 13).
          nodes=$(for f in "${props[@]}"; do basename "$(dirname "$f")"; done | grep -vE -- '-(neoforge|forge)$' \
            | jq -R . | jq -cs .)
          echo "Version nodes: $nodes"
          echo "nodes=$nodes" >> "$GITHUB_OUTPUT"

  client:
    name: Client GameTests (${{ matrix.node }})
    needs: client-nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.client-nodes.outputs.nodes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs
        id: jdk
        uses: ./.github/actions/setup-jdks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The game needs a display and a GPU: Xvfb, and Mesa's software drivers. 1.21.11-26.2 render with OpenGL
      # (llvmpipe); 26.3 finds no GLX visual under Xvfb and falls back to Vulkan (lavapipe, mesa-vulkan-drivers;
      # without it the 26.3 client can't start). First run 2026-10-19: all four green.
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb libgl1-mesa-dri libegl-mesa0 mesa-vulkan-drivers

      - name: Client GameTests
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24"
          ./gradlew :${{ matrix.node }}:runClientGameTest --no-daemon --stacktrace
          -Porg.gradle.java.installations.fromEnv=${{ steps.jdk.outputs.from_env }}

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametests-${{ matrix.node }}-${{ github.sha }}
          path: |
            versions/${{ matrix.node }}/build/run/clientGameTest/screenshots/
            versions/${{ matrix.node }}/build/run/clientGameTest/logs/latest.log
            versions/${{ matrix.node }}/build/run/clientGameTest/crash-reports/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt. Change both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every commit
        run: |
          set -euo pipefail
          commits=$(git rev-list --all --count)
          echo "Scanning ${commits} commits."
          if [ "$commits" -lt 1 ]; then
            echo "::error::No commits to scan; the checkout is not a full clone. Refusing to report a clean scan."
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --log-opts="--all" .
