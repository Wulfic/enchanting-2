# ---------------------------------------------------------------------------
# CI: every push to main and every pull request.
#
#   build    ./gradlew build in every version node: compiles, runs the JUnit suite and the server GameTests. The jars
#            (versions/<node>/build/libs/) are kept as a run artifact for 14 days, so any commit can be tried in game
#            without building it.
#   secrets  gitleaks over the WHOLE history, not just the pushed commits. The repo went public after a history
#            scrub (TODO 11e); a secret committed again would be public on push, so this job fails the run loudly.
#
# Client GameTests (./gradlew runClientGameTest) are not run here: they open a game window. Run them locally.
# Releases are a separate workflow (release.yml), started by pushing a v* tag.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The JDKs, read from the properties files rather than pinned here: each version node's java_version
      # (versions/<node>/gradle.properties) is what that node is compiled for (a toolchain), and the root's
      # gradle_java_version is what Gradle itself must run on (Loom needs the newer one).
      - name: Read the JDK levels
        id: jdk
        run: |
          set -euo pipefail
          prop() { grep -E "^$2=" "$1" | head -n1 | cut -d= -f2- | tr -d '[:space:]'; }
          major() {
            case "$2" in
              ''|*[!0-9]*) echo "::error::$1 has '$2', not a plain major version (e.g. 21)." >&2; return 1 ;;
            esac
          }
          gjv=$(prop gradle.properties gradle_java_version); major "gradle.properties gradle_java_version" "$gjv"
          shopt -s nullglob
          nodes=(versions/*/gradle.properties)
          if [ ${#nodes[@]} -eq 0 ]; then
            echo "::error::No versions/<node>/gradle.properties found; settings.gradle declares the nodes."
            exit 1
          fi
          levels=""
          for f in "${nodes[@]}"; do
            v=$(prop "$f" java_version); major "$f java_version" "$v"
            levels="$levels $v"
          done
          # Unique, without Gradle's own JDK (setup-java lists it last so it becomes JAVA_HOME).
          mods=$(printf '%s\n' $levels | sort -un | grep -vx "$gjv" || true)
          {
            echo "mod_jdks<<EOF"
            for v in $mods; do echo "$v"; done
            echo "EOF"
            echo "gradle_java_version=$gjv"
            # Every JDK a toolchain may ask for, as the env vars setup-java sets (JAVA_HOME_<n>_X64).
            echo "from_env=$(for v in $mods $gjv; do printf 'JAVA_HOME_%s_X64,' "$v"; done | sed 's/,$//')"
          } >> "$GITHUB_OUTPUT"

      # The last version listed becomes JAVA_HOME, so Gradle runs on gradle_java_version.
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ steps.jdk.outputs.mod_jdks }}
            ${{ steps.jdk.outputs.gradle_java_version }}

      # Also validates the Gradle wrapper jar's checksum against Gradle's published list.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # fromEnv points the toolchains at the JDKs setup-java installed, instead of foojay downloading others.
      # `build` runs in every version node (versions/<node>/).
      - name: Build
        run: >-
          ./gradlew build --no-daemon --stacktrace
          -Porg.gradle.java.installations.fromEnv=${{ steps.jdk.outputs.from_env }}

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: enchanting2-${{ github.sha }}
          path: versions/*/build/libs/*.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            versions/*/build/reports/
            versions/*/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt. Change both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every commit
        run: |
          set -euo pipefail
          commits=$(git rev-list --all --count)
          echo "Scanning ${commits} commits."
          if [ "$commits" -lt 1 ]; then
            echo "::error::No commits to scan; the checkout is not a full clone. Refusing to report a clean scan."
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --log-opts="--all" .
