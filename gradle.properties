org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Stonecutter warns on every run that it prefers Kotlin DSL. The build stays Groovy (decisions.md 2026-10-14, 12A).
dev.kikugie.stonecutter.hard_mode=true

# Shared by every version node. Per-version keys (minecraft_version, fabric_api_version, java_version, modmenu_version,
# yacl_version, run_root) live in versions/<node>/gradle.properties (Phase 12, Stonecutter).
# Fabric toolchain: verified 2026-10-06 against meta.fabricmc.net, maven-metadata, Modrinth and
# FabricMC/fabric-example-mod@1.21.11. See TODO.md Phase 1.
loader_version=0.19.5
# Read by loom-back-compat (settings.gradle), which applies fabric-loom-remap or fabric-loom at this version.
loomx.loom_version=1.18.4
# The JDK Gradle itself runs on. Loom 1.18 refuses anything older (settings.gradle checks it first); the mod is still
# compiled for each node's java_version through the toolchain.
gradle_java_version=25

# The version YACL nests in META-INF/jars; dev runtime only.
quilt_parsers_version=0.2.1
jankson_version=1.2.3

# Tests
junit_version=5.11.4

# Mod
mod_version=1.0.1
maven_group=com.wulfnet.enchanting2
archives_base_name=enchanting2
