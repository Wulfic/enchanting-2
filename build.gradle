// This script is applied to each Stonecutter version node (versions/<node>/, settings.gradle). Paths that must not
// move with the node (run dirs, docs read by tests) go through rootProject.
plugins {
    // fabric-loom-remap on obfuscated versions (1.21.11, gotchas.md 2026-10-06), fabric-loom on 26.x. Keeps the mod*
    // configurations working on both; Loom's version is loomx.loom_version in the root gradle.properties.
    id 'dev.kikugie.loom-back-compat'
}

stonecutter {
    // This script builds the Fabric nodes; the NeoForge and Forge nodes set their own loader (Phase 13). Loader code
    // lives in platform/<loader>/ and is picked in platform/Services with //? if fabric (decisions.md 2026-10-20).
    constants.match('fabric', 'fabric', 'neoforge', 'forge')
}

repositories {
    mavenCentral()
    // Optional client mods for the config screen (2C). Each repo serves only its own group.
    exclusiveContent {
        forRepository { maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' } }
        filter { includeGroup 'com.terraformersmc' }
    }
    exclusiveContent {
        forRepository { maven { name = 'isXander'; url = 'https://maven.isxander.dev/releases/' } }
        filter { includeGroup 'dev.isxander' }
    }
    // YACL's JSON parsers, for the dev runtime only (see dependencies).
    exclusiveContent {
        forRepository { maven { name = 'Quilt'; url = 'https://maven.quiltmc.org/repository/release/' } }
        filter { includeGroup 'org.quiltmc.parsers' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'enchanting2' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Separate run dirs so the client's singleplayer saves and the dev server's world never mix, and one root per node
    // (run_root) so a newer Minecraft never upgrades another node's worlds. runDir is relative to the node's project
    // dir, hence the relativePath. The dev server listens on 25566: the owner often has another mod's server on 25565.
    runs {
        client {
            runDir project.relativePath(rootProject.file("${project.run_root}/client"))
        }
        server {
            runDir project.relativePath(rootProject.file("${project.run_root}/server"))
            programArgs '--port', '25566'
        }
    }
}

// The dev server refuses to start until eula.txt says true. Same acceptance as `eula = true` in
// configureTests below. Writes only when the file is absent, so it never overwrites an existing eula.txt.
def devServerEula = rootProject.file("${project.run_root}/server/eula.txt")
def acceptDevServerEula = tasks.register('acceptDevServerEula') {
    onlyIf { !devServerEula.exists() }
    doLast {
        devServerEula.parentFile.mkdirs()
        devServerEula.text = '# Accepted for the local dev server (see build.gradle).\neula=true\n'
        logger.lifecycle("Wrote ${devServerEula}")
    }
}
tasks.named('runServer') {
    dependsOn acceptDevServerEula
}

// `gametest` source set (src/gametest/) is a separate mod, `enchanting2-gametest`, loaded only by
// `./gradlew runGameTest`. It is never in the shipped jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'enchanting2-gametest'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}
// Fabric's client GameTest API 4.x (1.21.11 only; 5+ on 26.x has no synchronizer) counts each packet and makes every
// client tick wait until it's handled. A world close zeroes the count before the connection closes, while the
// integrated server still ticks; a packet lost in that gap fails the run 10 s later ("Network synchronizer in invalid
// state", gotchas.md 2026-10-13, 2026-10-19). Fabric's documented switch turns it off, as 26.x runs anyway.
// NetworkSynchronizerClientGameTest leaks a count on purpose and fails if this goes.
if (!sc.current.parsed.matches('>=26.1')) {
    loom.runs.named('clientGameTest') {
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    }
}
// build/gametest-report.xml + the check that fails a run with no test cases (Phase 12F; shared with the matrix).
apply from: rootProject.file('gradle/gametest-report.gradle')

// Phase 12C: the runtime matrix (matrix/<line>/, matrix/matrix.gradle) runs this node's shipped mod jar and a jar of
// its GameTests on other Minecraft versions, without compiling anything there. Artifacts only: no dependencies travel
// with them, so the matrix node's own Fabric API and libraries are the only ones on its classpath. Only 26.x nodes can
// feed it: on 1.21.11 the GameTest jar holds unremapped Mojang names and runs in no production-named game.
def gametestJar = tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.named('gametest').map { it.output }
}
configurations {
    matrixModJar {
        canBeConsumed = true
        canBeResolved = false
    }
    matrixGametestJar {
        canBeConsumed = true
        canBeResolved = false
    }
}
artifacts {
    matrixModJar loomx.modJar
    matrixGametestJar gametestJar
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mojang mappings on obfuscated versions; 26.x needs none (unobfuscated).
    loomx.applyMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JSON5 config reader/writer. Plain Java, bundled jar-in-jar so a dedicated server needs only Fabric API.
    implementation "blue.endless:jankson:${project.jankson_version}"
    include "blue.endless:jankson:${project.jankson_version}"

    // Config screen: optional on the player's side ("suggests"), never shipped or bundled. Compiled against, and on
    // the dev run classpath only. Not transitive: YACL nests its own libraries, and its Kotlin-only parts (dsl,
    // config.v3) are never referenced. YACL is environment "*", so it also loads on the dev server and GameTests.
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    modCompileOnly("dev.isxander:yet-another-config-lib:${project.yacl_version}") { transitive = false }
    modLocalRuntime("dev.isxander:yet-another-config-lib:${project.yacl_version}") { transitive = false }
    // YACL nests these in META-INF/jars, but the dev runtime doesn't load a remapped mod's nested jars, and YACL's client
    // entrypoint needs them at startup (gotchas.md 2026-10-07). Dev runtime only; players get them inside YACL's jar.
    // Not transitive: their only dependency is gson, which Minecraft ships.
    localRuntime("org.quiltmc.parsers:json:${project.quilt_parsers_version}") { transitive = false }
    localRuntime("org.quiltmc.parsers:gson:${project.quilt_parsers_version}") { transitive = false }

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The other loaders' code stays out of the Fabric nodes (Phase 13C; PlatformImportsTest keeps every loader API inside
// its own platform/<loader>/ package). Their resources live in src/<loader>/resources, which only their nodes read.
sourceSets.configureEach {
    java.exclude '**/platform/neoforge/**', '**/platform/forge/**', '**/platform/forgelike/**', '**/mixin/neoforge/**',
        '**/mixin/forge/**', '**/mixin/forgelike/**'
}

// Minecraft renames, band version, resources, Java and JUnit: the same for every loader (gradle/common.gradle).
ext.mod_loader = 'fabric'
apply from: rootProject.file('gradle/common.gradle')
