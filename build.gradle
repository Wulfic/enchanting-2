plugins {
    // 1.21.11 is obfuscated, so it needs the remapping variant. See gotchas.md 2026-10-06.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Optional client mods for the config screen (2C). Each repo serves only its own group.
    exclusiveContent {
        forRepository { maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' } }
        filter { includeGroup 'com.terraformersmc' }
    }
    exclusiveContent {
        forRepository { maven { name = 'isXander'; url = 'https://maven.isxander.dev/releases/' } }
        filter { includeGroup 'dev.isxander' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'enchanting2' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Separate run dirs so the client's singleplayer saves and the dev server's world never mix.
    // The dev server listens on 25566: the owner often has another mod's server on 25565.
    runs {
        client {
            runDir 'run/client'
        }
        server {
            runDir 'run/server'
            programArgs '--port', '25566'
        }
    }
}

// The dev server refuses to start until eula.txt says true. Same acceptance as `eula = true` in
// configureTests below. Writes only when the file is absent, so it never overwrites an existing eula.txt.
def devServerEula = file('run/server/eula.txt')
def acceptDevServerEula = tasks.register('acceptDevServerEula') {
    onlyIf { !devServerEula.exists() }
    doLast {
        devServerEula.parentFile.mkdirs()
        devServerEula.text = '# Accepted for the local dev server (see build.gradle).\neula=true\n'
        logger.lifecycle("Wrote ${devServerEula}")
    }
}
tasks.named('runServer') {
    dependsOn acceptDevServerEula
}

// `gametest` source set (src/gametest/) is a separate mod, `enchanting2-gametest`, loaded only by
// `./gradlew runGameTest`. It is never in the shipped jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'enchanting2-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JSON5 config reader/writer. Plain Java, bundled jar-in-jar so a dedicated server needs only Fabric API.
    implementation "blue.endless:jankson:${project.jankson_version}"
    include "blue.endless:jankson:${project.jankson_version}"

    // Config screen: optional on the player's side ("suggests"), never shipped or bundled. Compiled against, and on
    // the dev run classpath only. Not transitive: YACL nests its own libraries, and its Kotlin-only parts (dsl,
    // config.v3) are never referenced. YACL is environment "*", so it also loads on the dev server and GameTests.
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    modCompileOnly("dev.isxander:yet-another-config-lib:${project.yacl_version}") { transitive = false }
    modLocalRuntime("dev.isxander:yet-another-config-lib:${project.yacl_version}") { transitive = false }

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Captured at configuration time: the configuration cache rejects reading `project` inside an
// execution-time closure.
def modVersion = project.version
processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

// One declared Java level, read by every consumer. Refuses instead of defaulting: a jar compiled for
// the wrong release builds and tests clean, then fails at the player's launcher.
if (!project.hasProperty('java_version') || !(project.java_version.toString().trim() ==~ /\d+/)) {
    throw new GradleException("gradle.properties must declare java_version=<major>, e.g. java_version=21")
}
def javaLevel = project.java_version.toString().trim() as Integer

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaLevel)
    targetCompatibility = JavaVersion.toVersion(javaLevel)
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaLevel)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaLevel
    it.options.compilerArgs << '-Xlint:deprecation'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
