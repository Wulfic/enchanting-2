# Band B1 on NeoForge: Minecraft 26.1.2 (Phase 13C). Same Minecraft and Java as versions/26.1.2 (Fabric); built by
# build.neoforge.gradle (ModDevGradle). Per-node keys only; shared ones are in the root gradle.properties.
# Verified 2026-10-20 against maven.neoforged.net metadata: 26.1.2.122 is the newest stable 26.1.2 build.
minecraft_version=26.1.2
neo_version=26.1.2.122
java_version=25

# Where runClient / runServer keep their worlds, relative to the repo root. Its own root: a NeoForge world never shares
# saves with the Fabric node's.
run_root=run/26.1.2-neoforge

# neoforge.mods.toml "minecraft" versionRange for this node's jar (Maven range syntax, expanded by processResources).
# NeoForge B1 = 26.1.2 only: NeoForge 26.1 / 26.1.1 are still beta builds (owner 2026-10-20: 13F tries to widen it with
# runtime nodes on them, as matrix/ does for Fabric).
minecraft_dependency=[26.1.2,26.1.3)
# neoforge.mods.toml "neoforge" versionRange: the build this node compiles against, or newer within 26.1.2.
neoforge_dependency=[26.1.2.122,26.1.3)
