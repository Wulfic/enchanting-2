# Band B floor: Minecraft 26.1.2 (unobfuscated, Mojang names, no remapping, Java 25). TODO.md Phase 12B.
# Per-node keys only; shared ones (mod version, loader, Loom, libraries) are in the root gradle.properties.
# Verified 2026-10-14 against maven.fabricmc.net, maven.isxander.dev and Modrinth (Mod Menu 18.x is the 26.1.x line).
minecraft_version=26.1.2
fabric_api_version=0.155.3+26.1.2
java_version=25

# Optional client deps and the config library (Phase 2).
modmenu_version=18.0.2
yacl_version=3.9.7+26.1-fabric

# Where runClient / runServer keep their worlds, relative to the repo root. Its own root, so 26.x never upgrades the
# 1.21.11 node's saves (run/client, run/server).
run_root=run/26.1.2

# fabric.mod.json "minecraft" for this node's jar (expanded by processResources). Only what the GameTests have proven:
# 12C runs this jar on 26.2 and 26.3 and widens the range to what passes.
minecraft_dependency=>=26.1.2 <26.2-
