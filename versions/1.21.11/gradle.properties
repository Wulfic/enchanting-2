# Band A: Minecraft 1.21.11 (obfuscated, Mojang mappings over intermediary, Java 21).
# Per-node keys only; shared ones (mod version, loader, Loom, libraries) are in the root gradle.properties.
# Verified 2026-10-06 against meta.fabricmc.net, maven-metadata, Modrinth and FabricMC/fabric-example-mod@1.21.11.
minecraft_version=1.21.11
fabric_api_version=0.141.6+1.21.11
java_version=21

# Optional client deps and the config library (Phase 2).
modmenu_version=17.0.1
yacl_version=3.8.1+1.21.11-fabric

# Where runClient / runServer keep their worlds, relative to the repo root. Each node gets its own, so a newer
# Minecraft never upgrades this one's saves. 1.21.11 keeps the pre-Phase-12 paths (run/client, run/server).
run_root=run
