# Band B1 on Forge: Minecraft 26.1.2 (Phase 13D). Same Minecraft and Java as versions/26.1.2 (Fabric); built by
# build.forge.gradle (ForgeGradle). Per-node keys only; shared ones are in the root gradle.properties.
# Verified 2026-10-20 against maven.minecraftforge.net metadata: 26.1.2-64.1.5 is the newest 26.1.2 build.
minecraft_version=26.1.2
forge_version=64.1.5
java_version=25

# Where runClient / runServer keep their worlds, relative to the repo root. Its own root: a Forge world never shares
# saves with another loader's.
run_root=run/26.1.2-forge

# mods.toml "minecraft" versionRange for this node's jar (Maven range syntax, expanded by processResources).
# Band B1 on Forge = 26.1.2 alone for now; widening to 26.1-26.1.2 is 13F (owner ruling).
minecraft_dependency=[26.1.2,26.1.3)
# mods.toml "forge" versionRange: the build this node compiles against, or newer within 26.1.2 (Forge 64.x).
forge_dependency=[64.1.5,65)

# pack.mcmeta's format range (gradle/common.gradle): Minecraft 26.1.2's version.json pack_version, resource_major and
# data_major. Forge loads a mod's data only from a mod with a pack.mcmeta.
resource_pack_format=84
data_pack_format=101
