# Band B3 on NeoForge: Minecraft 26.3 (Phase 13C). Same Minecraft and Java as versions/26.3 (Fabric); built by
# build.neoforge.gradle (ModDevGradle). Per-node keys only; shared ones are in the root gradle.properties.
# Verified 2026-10-20 against maven.neoforged.net metadata: 26.3.0.95 is the newest stable 26.3 build.
minecraft_version=26.3
neo_version=26.3.0.95
java_version=25

# Where runClient / runServer keep their worlds, relative to the repo root. Its own root: a NeoForge world never shares
# saves with the Fabric node's.
run_root=run/26.3-neoforge

# neoforge.mods.toml "minecraft" versionRange for this node's jar (Maven range syntax, expanded by processResources).
# Band B3 = 26.3 (decisions.md 2026-10-15); the runtime matrix may widen it later (TODO.md 13F).
minecraft_dependency=[26.3,26.4)
# neoforge.mods.toml "neoforge" versionRange: the build this node compiles against, or newer within 26.3.
neoforge_dependency=[26.3.0.95,26.4)
