# Band B3 on Forge: Minecraft 26.3 (Phase 13D). Same Minecraft and Java as versions/26.3 (Fabric); built by
# build.forge.gradle (ForgeGradle). Per-node keys only; shared ones are in the root gradle.properties.
# Verified 2026-10-20 against maven.minecraftforge.net metadata: 26.3-66.0.13 is the newest 26.3 build.
minecraft_version=26.3
forge_version=66.0.13
java_version=25

# Where runClient / runServer keep their worlds, relative to the repo root. Its own root: a Forge world never shares
# saves with another loader's.
run_root=run/26.3-forge

# mods.toml "minecraft" versionRange for this node's jar (Maven range syntax, expanded by processResources).
# Band B3 = 26.3 (decisions.md 2026-10-15); the runtime matrix may widen it later (TODO.md 13F).
minecraft_dependency=[26.3,26.4)
# mods.toml "forge" versionRange: the build this node compiles against, or newer within 26.3 (Forge 66.x).
forge_dependency=[66.0.13,67)
# pack.mcmeta's format range (gradle/common.gradle): Minecraft 26.3's version.json pack_version, resource_major and
# data_major. Forge loads a mod's data only from a mod with a pack.mcmeta.
resource_pack_format=97
data_pack_format=121
