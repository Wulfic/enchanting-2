# Band B2: Minecraft 26.2 (unobfuscated, Mojang names, no remapping, Java 25). TODO.md Phase 12D.
# Per-node keys only; shared ones (mod version, loader, Loom, libraries) are in the root gradle.properties.
# Verified 2026-10-15 against maven.fabricmc.net, maven.isxander.dev and Modrinth (Mod Menu 20.x is the 26.2 line).
minecraft_version=26.2
fabric_api_version=0.161.0+26.2
java_version=25

# Optional client deps and the config library (Phase 2).
modmenu_version=20.0.3
yacl_version=3.9.7+26.2-fabric

# Where runClient / runServer keep their worlds, relative to the repo root. Its own root, so no other node's saves are
# upgraded by 26.2.
run_root=run/26.2

# fabric.mod.json "minecraft" for this node's jar (expanded by processResources). Band B2 = 26.2 (decisions.md
# 2026-10-15 "One band per 26.x line"); a 26.2.x hotfix joins only through the runtime matrix (TODO.md 12H).
minecraft_dependency=>=26.2 <26.3-
