# Band B2 on Forge: Minecraft 26.2 (Phase 13D). Same Minecraft and Java as versions/26.2 (Fabric); built by
# build.forge.gradle (ForgeGradle). Per-node keys only; shared ones are in the root gradle.properties.
# Verified 2026-10-20 against maven.minecraftforge.net metadata: 26.2-65.1.5 is the newest 26.2 build.
minecraft_version=26.2
forge_version=65.1.5
java_version=25

# Where runClient / runServer keep their worlds, relative to the repo root. Its own root: a Forge world never shares
# saves with another loader's.
run_root=run/26.2-forge

# mods.toml "minecraft" versionRange for this node's jar (Maven range syntax, expanded by processResources).
# Band B2 = 26.2 (decisions.md 2026-10-15).
minecraft_dependency=[26.2,26.3)
# mods.toml "forge" versionRange: the build this node compiles against, or newer within 26.2 (Forge 65.x).
forge_dependency=[65.1.5,66)

# pack.mcmeta's format range (gradle/common.gradle): Minecraft 26.2's version.json pack_version, resource_major and
# data_major. Forge loads a mod's data only from a mod with a pack.mcmeta.
resource_pack_format=88
data_pack_format=107
